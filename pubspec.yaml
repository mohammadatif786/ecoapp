name: link_up
description: This is for app that you find your soul mate on online.

publish_to: "none"

version: 1.32.0+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components & Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  dots_indicator: ^3.0.0
  auto_size_text: ^3.0.0
  pretty_qr_code: ^3.3.0

  # Firebase Services
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  firebase_dynamic_links: ^6.0.11

  # Media & Audio / Video
  video_player: ^2.9.2
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  image: ^4.3.0
  agora_rtc_engine: ^6.5.1
  flutter_ringtone_player: ^4.0.0+4

  # Documents & PDFs
  pdf: ^3.11.1
  printing: ^5.13.3
  flutter_pdfview: ^1.4.0
  open_file: ^3.5.1
  file_picker: ^8.1.7

  # Payments
  flutter_stripe: ^11.4.0
  flutter_paypal: ^0.2.1
  pay: ^2.0.0

  # Maps, Location & Permissions
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Network & Utilities
  http: ^1.3.0
  http_auth: ^1.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  fluttertoast: ^8.2.10
  universal_platform: ^1.0.0+1
  share_plus: ^10.1.3
  rate_my_app: ^2.3.0
  html: ^0.15.5

  # UI Navigation & Layout Controls
  get: ^4.6.6
  flutter_slidable: ^3.1.2
  emoji_picker_flutter: ^3.0.0
  flutter_swiper_plus: ^2.0.4
  swiping_card_deck: ^1.2.0
  carousel_slider: ^5.0.0
  swipeable_card_stack: ^0.0.5
  smooth_star_rating_nsafe: ^1.0.0+1
  flutter_limited_checkbox: ^0.0.1

  # Pickers & Fields
  country_code_picker: ^3.3.0
  country_picker: ^2.0.27
  country_state_city_picker: ^1.2.8
  pin_code_fields: ^8.0.1
  google_sign_in: ^6.2.2

  # Serialization
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0

# Forces sub-dependencies to use 16 KB aligned binaries
dependency_overrides:
  iris_method_channel: ^2.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  rxdart: ^0.28.0
  build_runner: ^2.4.14

flutter_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/image/splash.png
    - assets/image/auth_background.png
    - assets/image/loading_background.png
    - assets/image/red.png
    - assets/image/green.png
    - assets/image/back.png
    - assets/image/sample_avatar.png
    - assets/image/
    - assets/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf